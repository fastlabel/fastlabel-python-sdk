[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlabel"
description = "The official Python SDK for FastLabel API, the Data Platform for AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "fastlabel", email = "dev@fastlabel.ai" }
]
dependencies = [
  "requests>=2.4.2,<3.0",
  "numpy>=1.26.0,<3.0.0",
  "geojson>=2.0.0,<4.0",
  "xmltodict==0.12.0",
  "Pillow>=11.0.0,<13.0.0",
  "opencv-python>=4.10.0,<5.0.0"
]

dynamic = ["version"]

[project.optional-dependencies]
# pyarrow 26 requires NumPy 2.0+, while this package still supports NumPy 1.26.
# Remove the upper bound once NumPy 1.x support is dropped.
robotics = ["pandas>=2.2.2", "pyarrow>=18.0.0,<26"]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
